name: Eval Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: groundcrew
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: groundcrew
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      DATABASE_URL: postgresql+psycopg://groundcrew:ci_password@localhost:5432/groundcrew
      QDRANT_URL: http://localhost:6333
      REPO_OWNER: colinhacks
      REPO_NAME: zod
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://localhost:11434
      OLLAMA_MODEL: llama3.2:3b

    steps:
      - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Create tables
        working-directory: apps/api
        run: python init_db.py

      - name: Load golden set
        working-directory: apps/api
        run: python load_golden_set.py

      - name: Index golden set into Qdrant
        working-directory: apps/api
        run: python index_to_qdrant.py

      - name: Run eval gate
        working-directory: apps/api
        run: python ci_eval_gate.py